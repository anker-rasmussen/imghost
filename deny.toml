# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false
no-default-features = false

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # RUSTSEC-2023-0071 — Marvin timing attack in `rsa` 0.9.x.
    # Pulled in via sqlx-mysql (a transitive of sqlx's `macros` feature). We
    # only use sqlite at runtime — no MySQL connection is ever instantiated,
    # so the vulnerable RSA paths are unreachable. No upstream fix as of 2026.
    # Mirrored in .cargo/audit.toml. Re-evaluate when sqlx or rsa ship a fix.
    "RUSTSEC-2023-0071",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
