name: Deploy

# Two ways to fire this:
#   1. `git tag v0.1.0 && git push --tags` — tags are the release gate.
#   2. `gh workflow run deploy.yml -f tag=v0.1.0` — re-deploy any prior tag
#      (sha-<short> or vX.Y.Z) without a new commit. This is the rollback path.
#
# Either way the workflow promotes the chosen image to `:vX.Y.Z` (and `:latest`
# if a v-tag was provided) in GHCR, then SSHes the host via Cloudflare Access
# and runs `docker compose pull && up -d`.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. v0.1.0 or sha-abc1234)"
        required: true
        type: string

# Only one deploy at a time, but never cancel an in-flight deploy with a newer
# one — let it finish so we know what's actually running on the host.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/imghost
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Resolve source and target tags
        id: img
        # Inputs are passed via env, never interpolated into the script body —
        # `${{ inputs.tag }}` inline would be templated before bash sees it,
        # giving anyone with workflow_dispatch access RCE on the runner.
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            VERSION="$REF_NAME"
            SOURCE="sha-$(git rev-parse --short=7 "$GITHUB_SHA")"
            PROMOTE_LATEST=true
          else
            if ! [[ "$INPUT_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|sha-[0-9a-f]{7})$ ]]; then
              echo "::error::invalid tag format: $INPUT_TAG (expected vX.Y.Z or sha-<7hex>)"
              exit 1
            fi
            VERSION="$INPUT_TAG"
            SOURCE="$INPUT_TAG"
            # Only promote :latest when redeploying a versioned tag; refuse to
            # point :latest at a raw sha-* tag (keeps :latest meaningful).
            case "$VERSION" in
              v*.*.*) PROMOTE_LATEST=true ;;
              *) PROMOTE_LATEST=false ;;
            esac
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "promote_latest=$PROMOTE_LATEST" >> "$GITHUB_OUTPUT"
          echo "Deploying $SOURCE -> $VERSION (promote :latest = $PROMOTE_LATEST)"

      # On a tag push, CI fires on the matching master push in parallel and
      # publishes the sha-<short> image. Wait for that CI run to finish before
      # we look for the image — otherwise we race CI's `docker push` and fail.
      # Skipped on workflow_dispatch (manual rollback) since the image is
      # already in GHCR by definition.
      - name: Wait for CI on this commit
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          echo "Looking up CI run for $SHA..."
          RUN_ID=""
          for i in $(seq 1 60); do
            RUN_ID=$(gh run list --workflow=ci.yml --commit "$SHA" --limit 1 --json databaseId -q '.[0].databaseId // empty' || true)
            if [ -n "$RUN_ID" ]; then break; fi
            echo "  no CI run yet for $SHA ($i/60); sleeping 5s..."
            sleep 5
          done
          if [ -z "$RUN_ID" ]; then
            echo "::error::no CI run found for $SHA after 5 minutes"
            exit 1
          fi
          echo "Waiting on CI run $RUN_ID (deploy will fail if CI fails)..."
          gh run watch "$RUN_ID" --exit-status

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source image exists
        run: |
          set -euo pipefail
          if ! docker manifest inspect "$IMAGE:${{ steps.img.outputs.source }}" > /dev/null 2>&1; then
            echo "::error::Source image $IMAGE:${{ steps.img.outputs.source }} not found in GHCR."
            echo "If this is a fresh tag, did CI on the tagged commit finish pushing? Check the CI run for that SHA."
            exit 1
          fi

      - name: Promote tags
        run: |
          set -euo pipefail
          SRC="$IMAGE:${{ steps.img.outputs.source }}"
          VER="$IMAGE:${{ steps.img.outputs.version }}"
          docker pull "$SRC"
          # Skip re-tagging if source == version (workflow_dispatch with sha-* tag).
          if [ "$SRC" != "$VER" ]; then
            docker tag "$SRC" "$VER"
            docker push "$VER"
          fi
          if [ "${{ steps.img.outputs.promote_latest }}" = "true" ]; then
            docker tag "$SRC" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Trigger host deploy
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          set -euo pipefail
          # The remote authorized_keys forced-command runs `docker compose pull
          # && up -d` against /opt/imghost/docker-compose.yml. We pass no remote
          # command — the forced-command supplies it — and -T to skip PTY.
          ssh -T \
              -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              "deploy@$DEPLOY_SSH_HOST"

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE:${{ steps.img.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$IMAGE:${{ steps.img.outputs.source }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- :latest promoted: \`${{ steps.img.outputs.promote_latest }}\`" >> "$GITHUB_STEP_SUMMARY"
