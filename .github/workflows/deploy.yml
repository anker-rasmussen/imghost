name: Deploy

# Fired two ways:
#   1. CI completes successfully on master AND a v*.*.* tag points at that
#      same commit. The `check` job decides whether to proceed; if no tag
#      is pointing at HEAD, deploy is silently skipped (a master commit
#      without a release tag is just a normal master push).
#   2. `gh workflow run deploy.yml -f tag=v0.1.0` — manual rollback to any
#      prior image already in GHCR. No CI dependency; the image is in
#      GHCR by definition.
#
# This replaces the older "deploy on tag push, then poll CI from inside
# the deploy job" shape. That polling step (gh run watch --exit-status)
# turned every transient GitHub API hiccup into a deploy failure, which
# is what bit us on v0.2.2 (HTTP 504 mid-poll).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy (e.g. v0.1.0 or sha-abc1234)"
        required: true
        type: string

# Only one deploy at a time, but never cancel an in-flight deploy with a
# newer one — let it finish so we know what's actually running on the host.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  check:
    name: Resolve deploy target
    runs-on: ubuntu-latest
    # Skip the workflow_run path entirely if CI failed; rollback path
    # (workflow_dispatch) runs unconditionally because the image is
    # already known to exist.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    outputs:
      should_deploy: ${{ steps.resolve.outputs.should_deploy }}
      version: ${{ steps.resolve.outputs.version }}
      source: ${{ steps.resolve.outputs.source }}
      promote_latest: ${{ steps.resolve.outputs.promote_latest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # workflow_run defaults to the default-branch HEAD; we want the
          # exact SHA CI just validated. workflow_dispatch doesn't need a
          # specific SHA but checkout still works at github.sha.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          # Need release tags to answer "does a v*.*.* tag point at HEAD?".
          fetch-tags: true

      - name: Resolve source and target tags
        id: resolve
        # Inputs are passed via env, never interpolated into the script
        # body — `${{ inputs.tag }}` inline would be templated before bash
        # sees it, giving anyone with workflow_dispatch access RCE on the
        # runner.
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ]; then
            VERSION=$(git tag --points-at "$HEAD_SHA" \
                      | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                      | head -1 || true)
            if [ -z "$VERSION" ]; then
              echo "No v*.*.* tag points at $HEAD_SHA — nothing to deploy."
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            SOURCE="sha-$(git rev-parse --short=7 "$HEAD_SHA")"
            PROMOTE_LATEST=true
          else
            if ! [[ "$INPUT_TAG" =~ ^(v[0-9]+\.[0-9]+\.[0-9]+|sha-[0-9a-f]{7})$ ]]; then
              echo "::error::invalid tag format: $INPUT_TAG (expected vX.Y.Z or sha-<7hex>)"
              exit 1
            fi
            VERSION="$INPUT_TAG"
            SOURCE="$INPUT_TAG"
            # Only promote :latest when redeploying a versioned tag; refuse
            # to point :latest at a raw sha-* tag (keeps :latest meaningful).
            case "$VERSION" in
              v*.*.*) PROMOTE_LATEST=true ;;
              *)      PROMOTE_LATEST=false ;;
            esac
          fi
          echo "should_deploy=true"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"             >> "$GITHUB_OUTPUT"
          echo "source=$SOURCE"               >> "$GITHUB_OUTPUT"
          echo "promote_latest=$PROMOTE_LATEST" >> "$GITHUB_OUTPUT"
          echo "Deploying $SOURCE -> $VERSION (promote :latest = $PROMOTE_LATEST)"

  deploy:
    name: Deploy
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/imghost
    steps:
      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify source image exists
        run: |
          set -euo pipefail
          if ! docker manifest inspect "$IMAGE:${{ needs.check.outputs.source }}" > /dev/null 2>&1; then
            echo "::error::Source image $IMAGE:${{ needs.check.outputs.source }} not found in GHCR."
            echo "If this is a fresh tag, the CI Image job for that SHA must have published before this point."
            exit 1
          fi

      - name: Promote tags
        run: |
          set -euo pipefail
          SRC="$IMAGE:${{ needs.check.outputs.source }}"
          VER="$IMAGE:${{ needs.check.outputs.version }}"
          docker pull "$SRC"
          # Skip re-tagging if source == version (workflow_dispatch with sha-* tag).
          if [ "$SRC" != "$VER" ]; then
            docker tag "$SRC" "$VER"
            docker push "$VER"
          fi
          if [ "${{ needs.check.outputs.promote_latest }}" = "true" ]; then
            docker tag "$SRC" "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi

      - name: Install cloudflared
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          sudo install -m 0755 /tmp/cloudflared /usr/local/bin/cloudflared
          cloudflared --version

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy

      - name: Trigger host deploy
        env:
          TUNNEL_SERVICE_TOKEN_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          TUNNEL_SERVICE_TOKEN_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          set -euo pipefail
          # The remote authorized_keys forced-command runs `docker compose pull
          # && up -d` against /opt/imghost/docker-compose.yml. We pass no remote
          # command — the forced-command supplies it — and -T to skip PTY.
          ssh -T \
              -i ~/.ssh/id_deploy \
              -o StrictHostKeyChecking=accept-new \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts.deploy" \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              "deploy@$DEPLOY_SSH_HOST"

      - name: Summary
        run: |
          echo "### Deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Image: \`$IMAGE:${{ needs.check.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Source: \`$IMAGE:${{ needs.check.outputs.source }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- :latest promoted: \`${{ needs.check.outputs.promote_latest }}\`" >> "$GITHUB_STEP_SUMMARY"
