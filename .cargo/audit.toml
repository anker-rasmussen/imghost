# cargo-audit configuration
# https://docs.rs/cargo-audit/latest/cargo_audit/config/

[advisories]
ignore = [
    # RUSTSEC-2023-0071 — Marvin timing attack in `rsa` 0.9.x.
    # sqlx-mysql (and its rsa dep) lands in Cargo.lock because Cargo locks
    # all optional deps for stability, but our sqlx features are
    # ["runtime-tokio", "sqlite", "macros", "migrate"] — no "mysql", so
    # sqlx-mysql is never actually compiled in. cargo-deny's feature-aware
    # graph confirms this (RUSTSEC-2023-0071 doesn't match anything there);
    # cargo-audit just scans the raw lockfile, so it still needs this ignore.
    # No fixed rsa release exists as of 2026. Re-evaluate when one ships.
    "RUSTSEC-2023-0071",
]
