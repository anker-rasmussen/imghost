[defaults]
inventory            = inventory/hosts.yml
roles_path           = roles
host_key_checking    = True
retry_files_enabled  = False
forks                = 5
stdout_callback      = yaml
nocows               = 1
interpreter_python   = auto_silent
# Per-project default. Each operator (fieldcom + defcom) needs the file
# at this path locally — `~` expands to the running user's $HOME, so the
# path is portable across machines without editing this file. The file
# itself never goes in the repo (.gitignore guards). Override on the CLI
# with --ask-vault-pass or --vault-password-file when you don't have it.
vault_password_file = ~/.config/imghost-vault-pass

[ssh_connection]
pipelining = True
