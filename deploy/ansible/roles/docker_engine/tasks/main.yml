---
# Installs Docker Engine + the compose v2 plugin from the official
# Docker apt repo on Debian/Ubuntu. The host must be running a Debian
# derivative; if you're on RHEL/Arch/etc., this role needs to be
# adapted (or replaced with the geerlingguy.docker role).
- name: Verify host is Debian-family
  ansible.builtin.assert:
    that:
      - ansible_facts['os_family'] == 'Debian'
    fail_msg: >-
      docker_engine role currently supports Debian/Ubuntu only.
      Detected os_family={{ ansible_facts['os_family'] }}.

- name: Install apt prerequisites for the Docker repo
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Ensure /etc/apt/keyrings exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Fetch Docker apt signing key
  ansible.builtin.get_url:
    url: "https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}/gpg"
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
    force: false

- name: Add Docker apt repository
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ ansible_facts['architecture']
                    | replace('x86_64', 'amd64')
                    | replace('aarch64', 'arm64') }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/{{ ansible_facts['distribution'] | lower }}
      {{ ansible_facts['distribution_release'] }} stable
    state: present
    filename: docker
    update_cache: true

- name: Install Docker Engine + compose v2 plugin
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Enable and start dockerd
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started

- name: Sanity-check `docker compose version`
  ansible.builtin.command: docker compose version
  register: docker_compose_version
  changed_when: false

- name: Show detected docker compose version
  ansible.builtin.debug:
    var: docker_compose_version.stdout
