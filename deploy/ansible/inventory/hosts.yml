---
# One host today. The group exists so adding a second box later costs
# nothing — drop another entry under `imghost.hosts` and the playbook
# applies unchanged.
#
# Per-host config (which interfaces sshd binds, etc.) lives in
# host_vars/<hostname>.yml — see host_vars/imghost.aigf.dev.yml.example.
#
# Reasonable connection options:
#
# 1. On the box itself, for the very first run:
#        ansible_connection: local
#
# 2. Direct SSH on the LAN — works today (sshd is wide open) and keeps
#    working after the playbook runs as long as the LAN IP is in
#    sshd_listen_addresses (see host_vars/...).
#
# 3. Over Tailscale — same: works as long as the tailscale IP is in
#    sshd_listen_addresses.
#
# 4. From off-LAN, through the cloudflared tunnel. Requires cloudflared
#    installed locally and a CF Access session for ssh.aigf.dev:
#        ansible_ssh_common_args: >-
#          -o ProxyCommand="cloudflared access ssh --hostname %h"
#          -o ServerAliveInterval=30
all:
  children:
    imghost:
      hosts:
        imghost.aigf.dev:
          # mincom on the LAN. Alternatives once the playbook has
          # applied (i.e. tailscale + cloudflared listeners are up):
          #   ansible_host: 100.108.123.14        # Tailscale IPv4
          #   ansible_host: mincom.tail-scale.ts.net  # Tailscale MagicDNS
          #   ansible_host: ssh.aigf.dev          # CF tunnel (needs ProxyCommand)
          ansible_host: 192.168.1.107
          ansible_user: broadcom
          ansible_port: 22
