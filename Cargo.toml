[package]
name = "imghost"
version = "0.2.2"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "imghost"
path = "src/main.rs"

[lib]
name = "imghost"
path = "src/lib.rs"

[dependencies]
axum = { version = "0.8.9", features = ["macros"] }
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread", "fs", "signal", "net"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "timeout", "set-header", "fs", "limit"] }
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
nanoid = "0.5.0"
infer = "0.19.0"
sha2 = "0.10.9"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
subtle = "2.6.1"
base64 = "0.22.1"
http = "1.4.0"
http-body-util = "0.1.3"
bytes = "1.11.1"
hex = "0.4.3"
anyhow = "1.0.102"
thiserror = "2.0.18"
mime = "0.3.17"

[dev-dependencies]
reqwest = { version = "0.13.2", features = ["json", "rustls"], default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.52.1", features = ["macros", "rt-multi-thread"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unused_lifetimes = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Allow a few pedantic lints that produce more noise than value in this codebase.
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
return_self_not_must_use = "allow"
needless_pass_by_value = "allow"
too_many_lines = "allow"
unreadable_literal = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
